name: Build images
# Builds auth + relay, runs the local end-to-end test (desktop sign-in flow plus
# upstream's relay splice smoke), and pushes to GHCR only if it passes.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orca-auth:local auth && docker build -t orca-relay:local relay
      - run: ./test/e2e.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for i in auth relay; do
            docker tag orca-$i:local ghcr.io/hmseeb/orca-$i:latest
            docker tag orca-$i:local ghcr.io/hmseeb/orca-$i:${GITHUB_SHA::7}
            docker push -a ghcr.io/hmseeb/orca-$i
          done
